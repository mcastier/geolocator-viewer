<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Geolocator — Real-time location track viewer on an interactive map">
    <title>Geolocator — Track Viewer</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f1a;
            --bg-glass: rgba(15, 15, 30, 0.75);
            --bg-glass-hover: rgba(25, 25, 50, 0.85);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent: #6c5ce7;
            --accent-glow: rgba(108, 92, 231, 0.4);
            --accent-light: #a29bfe;
            --success: #00cec9;
            --text-primary: #f0f0f5;
            --text-secondary: rgba(240, 240, 245, 0.6);
            --text-muted: rgba(240, 240, 245, 0.35);
            --danger: #ff6b6b;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* ── Map ── */
        #map {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        /* ── Control Panel ── */
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            width: 340px;
            background: var(--bg-glass);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.03) inset;
            transition: transform var(--transition), opacity var(--transition);
            animation: slideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to   { transform: translateY(0);     opacity: 1; }
        }

        #controls h1 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(135deg, var(--accent-light), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        #controls .subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            font-weight: 400;
        }

        .field-group {
            margin-bottom: 14px;
        }

        .field-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .field-group input[type="datetime-local"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .field-group input[type="datetime-local"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* Webkit datetime picker styling */
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(0.7);
            cursor: pointer;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }

        .btn {
            flex: 1;
            padding: 11px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity var(--transition);
        }

        .btn:hover::after {
            opacity: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #5a4bd1);
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            border: 1px solid var(--border-glass);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        /* ── Status Bar ── */
        #status {
            margin-top: 16px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            color: var(--text-secondary);
            min-height: 38px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all var(--transition);
        }

        #status.loading {
            border-color: var(--accent);
            color: var(--accent-light);
        }

        #status.success {
            border-color: var(--success);
            color: var(--success);
        }

        #status.error {
            border-color: var(--danger);
            color: var(--danger);
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid transparent;
            border-top-color: var(--accent-light);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Stats Row ── */
        .stats-row {
            display: none;
            gap: 8px;
            margin-top: 10px;
        }

        .stats-row.visible {
            display: flex;
        }

        .stat-card {
            flex: 1;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            text-align: center;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-light);
        }

        .stat-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            #controls {
                top: 10px;
                right: 10px;
                left: 10px;
                width: auto;
                padding: 18px;
            }
        }

        /* ── Leaflet overrides for dark theme ── */
        .leaflet-control-zoom a {
            background: var(--bg-glass) !important;
            backdrop-filter: blur(12px) !important;
            color: var(--text-primary) !important;
            border-color: var(--border-glass) !important;
        }
        .leaflet-control-zoom a:hover {
            background: var(--bg-glass-hover) !important;
        }
        .leaflet-control-attribution {
            background: var(--bg-glass) !important;
            backdrop-filter: blur(8px) !important;
            color: var(--text-muted) !important;
            font-size: 0.6rem !important;
        }
        .leaflet-control-attribution a {
            color: var(--text-secondary) !important;
        }

        /* Custom popup styling */
        .leaflet-popup-content-wrapper {
            background: var(--bg-glass) !important;
            backdrop-filter: blur(16px) !important;
            border: 1px solid var(--border-glass) !important;
            border-radius: var(--radius-sm) !important;
            color: var(--text-primary) !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
        }
        .leaflet-popup-tip {
            background: var(--bg-glass) !important;
        }
        .leaflet-popup-content {
            font-family: 'Inter', sans-serif !important;
            font-size: 0.8rem !important;
            line-height: 1.5 !important;
        }
        .popup-title {
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--accent-light), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .popup-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
        }
        .popup-label {
            color: var(--text-secondary);
            font-size: 0.72rem;
        }
        .popup-value {
            font-weight: 600;
            font-size: 0.78rem;
        }
    </style>
</head>
<body>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Control Panel -->
    <div id="controls">
        <h1>📍 Geolocator</h1>
        <p class="subtitle">Track Viewer</p>

        <div class="field-group">
            <label for="startTime">Start Time</label>
            <input type="datetime-local" id="startTime" />
        </div>

        <div class="field-group">
            <label for="endTime">End Time</label>
            <input type="datetime-local" id="endTime" />
        </div>

        <div class="btn-row">
            <button class="btn btn-primary" id="btnLoad" onclick="loadTrack()">Load Track</button>
            <button class="btn btn-secondary" id="btnPast3h" onclick="loadPast3Hours()">Past 3h</button>
            <button class="btn btn-secondary" id="btnMapTheme" onclick="toggleMapTheme()">☀ Light Map</button>
        </div>

        <div id="status">
            <span id="statusText">Ready. Select a time range to begin.</span>
        </div>

        <div class="stats-row" id="statsRow">
            <div class="stat-card">
                <div class="stat-value" id="statPoints">—</div>
                <div class="stat-label">Points</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statDuration">—</div>
                <div class="stat-label">Duration</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="statMaxSpeed">—</div>
                <div class="stat-label">Max km/h</div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <script>
        // ──────────────────────────────────────────────
        // CONFIGURATION — Replace with your Supabase credentials
        // ──────────────────────────────────────────────
        const SUPABASE_URL  = 'https://blypabobecdeferzjakh.supabase.co';
        const SUPABASE_KEY  = 'sb_publishable_GiRg7KAg0dZEudYoPTA8Lg__CgiH7lC';

        // ──────────────────────────────────────────────
        // Initialize Supabase client
        // ──────────────────────────────────────────────
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ──────────────────────────────────────────────
        // Initialize Leaflet map (dark tile layer)
        // ──────────────────────────────────────────────
        const map = L.map('map', {
            center: [0, 0],
            zoom: 3,
            zoomControl: true,
        });

        const tileLayers = {
            dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 20,
            }),
            light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 20,
            }),
        };

        let currentTheme = 'dark';
        tileLayers.dark.addTo(map);

        function toggleMapTheme() {
            const btn = document.getElementById('btnMapTheme');
            if (currentTheme === 'dark') {
                map.removeLayer(tileLayers.dark);
                tileLayers.light.addTo(map);
                currentTheme = 'light';
                btn.textContent = '☾ Dark Map';
            } else {
                map.removeLayer(tileLayers.light);
                tileLayers.dark.addTo(map);
                currentTheme = 'dark';
                btn.textContent = '☀ Light Map';
            }
        }

        // Track layers
        let trackPolyline = null;
        let lastMarker    = null;

        // ──────────────────────────────────────────────
        // Set default time inputs (past 3 hours → now)
        // ──────────────────────────────────────────────
        function toLocalISO(date) {
            const offset = date.getTimezoneOffset();
            const local  = new Date(date.getTime() - offset * 60000);
            return local.toISOString().slice(0, 16);
        }

        const now      = new Date();
        const past3h   = new Date(now.getTime() - 3 * 60 * 60 * 1000);
        document.getElementById('endTime').value   = toLocalISO(now);
        document.getElementById('startTime').value = toLocalISO(past3h);

        // ──────────────────────────────────────────────
        // Status helpers
        // ──────────────────────────────────────────────
        const statusEl   = document.getElementById('status');
        const statusText = document.getElementById('statusText');

        function setStatus(msg, type = '') {
            statusEl.className = type;
            statusText.textContent = msg;

            // Remove spinner if not loading
            const existingSpinner = statusEl.querySelector('.spinner');
            if (existingSpinner) existingSpinner.remove();

            if (type === 'loading') {
                const spinner = document.createElement('div');
                spinner.className = 'spinner';
                statusEl.prepend(spinner);
            }
        }

        // ──────────────────────────────────────────────
        // Clear existing track from map
        // ──────────────────────────────────────────────
        function clearTrack() {
            if (trackPolyline) { map.removeLayer(trackPolyline); trackPolyline = null; }
            if (lastMarker)    { map.removeLayer(lastMarker);    lastMarker    = null; }
            document.getElementById('statsRow').classList.remove('visible');
        }

        // ──────────────────────────────────────────────
        // Format duration
        // ──────────────────────────────────────────────
        function formatDuration(ms) {
            const totalSec = Math.floor(ms / 1000);
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            if (h > 0) return `${h}h ${m}m`;
            return `${m}m`;
        }

        // ──────────────────────────────────────────────
        // Load track from Supabase
        // ──────────────────────────────────────────────
        async function loadTrack() {
            const startInput = document.getElementById('startTime').value;
            const endInput   = document.getElementById('endTime').value;

            if (!startInput || !endInput) {
                setStatus('Please select both start and end times.', 'error');
                return;
            }

            const startISO = new Date(startInput).toISOString();
            const endISO   = new Date(endInput).toISOString();

            clearTrack();
            setStatus('Fetching location data…', 'loading');

            try {
                const { data, error } = await db
                    .from('location_history')
                    .select('latitude, longitude, speed_kmh, recorded_at')
                    .gte('recorded_at', startISO)
                    .lte('recorded_at', endISO)
                    .order('recorded_at', { ascending: true });

                if (error) throw error;

                if (!data || data.length === 0) {
                    setStatus('No data found for this time range.', 'error');
                    return;
                }

                // Build coordinate array
                const coords = data.map(p => [p.latitude, p.longitude]);

                // Draw polyline with gradient-like styling
                trackPolyline = L.polyline(coords, {
                    color: '#6c5ce7',
                    weight: 4,
                    opacity: 0.9,
                    smoothFactor: 1.5,
                    lineCap: 'round',
                    lineJoin: 'round',
                }).addTo(map);

                // Place marker at last position
                const lastPoint = data[data.length - 1];
                const lastCoord = [lastPoint.latitude, lastPoint.longitude];

                // Custom pulsing marker icon
                const pulseIcon = L.divIcon({
                    className: '',
                    html: `
                        <div style="
                            width: 18px; height: 18px;
                            background: #6c5ce7;
                            border: 3px solid #a29bfe;
                            border-radius: 50%;
                            box-shadow: 0 0 12px rgba(108,92,231,0.6), 0 0 24px rgba(108,92,231,0.3);
                            animation: pulse 2s ease-in-out infinite;
                        "></div>
                        <style>
                            @keyframes pulse {
                                0%, 100% { box-shadow: 0 0 12px rgba(108,92,231,0.6); transform: scale(1); }
                                50% { box-shadow: 0 0 24px rgba(108,92,231,0.8); transform: scale(1.15); }
                            }
                        </style>
                    `,
                    iconSize: [18, 18],
                    iconAnchor: [9, 9],
                });

                const lastTime = new Date(lastPoint.recorded_at);
                const popupContent = `
                    <div class="popup-title">Last Known Position</div>
                    <div class="popup-row">
                        <span class="popup-label">Lat</span>
                        <span class="popup-value">${lastPoint.latitude.toFixed(6)}</span>
                    </div>
                    <div class="popup-row">
                        <span class="popup-label">Lon</span>
                        <span class="popup-value">${lastPoint.longitude.toFixed(6)}</span>
                    </div>
                    <div class="popup-row">
                        <span class="popup-label">Speed</span>
                        <span class="popup-value">${lastPoint.speed_kmh.toFixed(1)} km/h</span>
                    </div>
                    <div class="popup-row">
                        <span class="popup-label">Time</span>
                        <span class="popup-value">${lastTime.toLocaleTimeString()}</span>
                    </div>
                `;

                lastMarker = L.marker(lastCoord, { icon: pulseIcon })
                    .addTo(map)
                    .bindPopup(popupContent, { maxWidth: 220 });

                // Fit map to track bounds
                map.fitBounds(trackPolyline.getBounds().pad(0.15));

                // Compute stats
                const maxSpeed = Math.max(...data.map(p => p.speed_kmh));
                const firstTime = new Date(data[0].recorded_at);
                const duration  = lastTime - firstTime;

                document.getElementById('statPoints').textContent   = data.length;
                document.getElementById('statDuration').textContent  = formatDuration(duration);
                document.getElementById('statMaxSpeed').textContent  = maxSpeed.toFixed(1);
                document.getElementById('statsRow').classList.add('visible');

                setStatus(`Loaded ${data.length} points.`, 'success');

            } catch (err) {
                console.error('Error loading track:', err);
                setStatus(`Error: ${err.message}`, 'error');
            }
        }

        // ──────────────────────────────────────────────
        // Quick filter: Past 3 Hours
        // ──────────────────────────────────────────────
        function loadPast3Hours() {
            const now    = new Date();
            const past3h = new Date(now.getTime() - 3 * 60 * 60 * 1000);
            document.getElementById('startTime').value = toLocalISO(past3h);
            document.getElementById('endTime').value   = toLocalISO(now);
            loadTrack();
        }
    </script>

</body>
</html>
